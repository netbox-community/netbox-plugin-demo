{% extends 'base.html' %}
{% block content %}
<h1>Backups for {{ device.name }}</h1>
<table class="table table-bordered">
    <thead>
    <tr>
        <th>Backup URL</th>
        <th>Last Updated</th>
    </tr>
    </thead>
    <tbody>
    {% for backup in backups %}
    <tr>
        <td><a href="{{ backup.backup_url }}" target="_blank">{{ backup.backup_url }}</a></td>
        <td>{{ backup.last_updated }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
